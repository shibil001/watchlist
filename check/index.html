<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src __SUPABASE_URL__; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="wrap">
    <section id="login" class="card login">
      <h1>Admin</h1>
      <label>Username<input id="u" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
      <label>Password<input id="p" type="password" autocomplete="off"></label>
      <label>PIN<input id="n" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label>
      <button id="go" type="button">Open</button>
      <p id="err" class="err" role="alert"></p>
    </section>

    <section id="dash" hidden>
      <header class="top">
        <h1>Usage</h1>
        <div class="right"><span id="stamp" class="mute"></span><button id="out" type="button" class="ghost">Lock</button></div>
      </header>

      <div class="live card"><span class="dot"></span><div><div class="big" id="live">0</div><div class="mute">online now</div></div></div>

      <div class="grid">
        <div class="card"><div class="big" id="accounts">0</div><div class="mute">total users (accounts)</div></div>
        <div class="card"><div class="big" id="total">0</div><div class="mute">all devices ever</div></div>
        <div class="card"><div class="big" id="day">0</div><div class="mute">last 24 hours</div></div>
        <div class="card"><div class="big" id="week">0</div><div class="mute">last 7 days</div></div>
        <div class="card"><div class="big" id="month">0</div><div class="mute">last 30 days</div></div>
        <div class="card"><div class="big" id="new">0</div><div class="mute">new today</div></div>
      </div>

      <div class="card"><h2>By app</h2><div id="platforms"></div></div>
      <div class="card"><h2>By country</h2><div id="countries"></div></div>
      <div class="card"><h2>New devices, last 14 days</h2><div id="daily" class="bars"></div></div>
      <p class="mute small">A "device" is one install or browser. "Online now" means seen in the last 3 minutes, which needs the app open and visible.</p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
